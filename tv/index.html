<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0F;
      color: #F0F0F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .logo span { color: #6C63FF; }
    .subtitle {
      color: #8E8EA0;
      font-size: 15px;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-block;
      background: #6C63FF;
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 15px;
      margin: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn.secondary {
      background: transparent;
      border: 1px solid #2A2A38;
      color: #8E8EA0;
    }
    .open-app {
      font-size: 14px;
      color: #4A4A5E;
      margin-top: 32px;
    }
  </style>
  <script>
    // FIX: detección de plataforma para mostrar solo la tienda relevante.
    // No toca el intento de abrir la app (streamdex://) que ya confirmaste
    // que funciona cuando el usuario sí tiene la app instalada.
    function detectPlatform() {
      const ua = navigator.userAgent || navigator.vendor || '';
      if (/android/i.test(ua)) return 'android';
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
      return 'other';
    }

    function applyStoreVisibility() {
      const platform = detectPlatform();
      const playBtn = document.getElementById('btn-play-store');
      const appleBtn = document.getElementById('btn-app-store');
      const genericMsg = document.getElementById('generic-download-msg');

      if (platform === 'android') {
        if (appleBtn) appleBtn.style.display = 'none';
      } else if (platform === 'ios') {
        if (playBtn) playBtn.style.display = 'none';
      } else {
        // Desktop u otro: mostramos ambos botones, pero con un mensaje
        // explicando que es para instalar en el celular.
        if (genericMsg) genericMsg.style.display = 'block';
      }
    }

    // Intentar abrir la app al cargar
    window.addEventListener('load', function() {
      applyStoreVisibility();

      const path = window.location.pathname;
      const deepLink = 'streamdex:/' + path;

      // Intentar abrir la app
      window.location.href = deepLink;

      // Si después de 2s sigue aquí, mostrar opciones de descarga
      setTimeout(function() {
        document.getElementById('download-section').style.display = 'block';
      }, 2000);
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">Stream<span>Dex</span></div>
    <p class="subtitle">Tu índice personal del mundo del streaming</p>
    
    <div id="download-section" style="display:none">
      <p style="color:#8E8EA0; margin-bottom:8px; font-size:14px;">
        Descarga StreamDex para ver este contenido
      </p>
      <p id="generic-download-msg" style="display:none; color:#4A4A5E; margin-bottom:16px; font-size:13px;">
        Ábrelo desde tu celular para instalar la app
      </p>
      <a id="btn-play-store"
         href="https://play.google.com/store/apps/details?id=com.akissame.streamdex" 
         class="btn">
        Google Play
      </a>
      <a id="btn-app-store"
         href="https://apps.apple.com/app/streamdex/idXXXXXXXX" 
         class="btn">
        App Store
      </a>
    </div>
    
    <p class="open-app">
      ¿Ya tienes la app? 
      <a href="javascript:void(0)" 
         onclick="window.location.href='streamdex:/'+window.location.pathname"
         style="color:#6C63FF; text-decoration:none;">
        Abrir en StreamDex
      </a>
    </p>
  </div>
</body>
</html>
