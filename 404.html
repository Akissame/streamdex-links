<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDex</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0A0A0F;
      color: #F0F0F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #6C63FF;
    }

    .subtitle {
      color: #8E8EA0;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .loader {
      width: 22px;
      height: 22px;
      margin: 0 auto 18px;
      border: 2px solid #2A2A38;
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status {
      color: #8E8EA0;
      font-size: 14px;
      line-height: 1.5;
    }

    .fallback {
      display: none;
      margin-top: 20px;
      color: #4A4A5E;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>

  <script>
    /*
     * StreamDex - Smart Redirect
     *
     * Flujo:
     *
     * 1. Detecta Android / iOS / escritorio.
     * 2. En móvil intenta abrir:
     *      streamdex:/<ruta-original>
     * 3. Si la aplicación no abre, redirige automáticamente
     *    a la Store correspondiente.
     *
     * IMPORTANTE:
     * No se modifica la URL original antes de intentar el deep link.
     * Esto permite que enlaces como:
     *
     *   /tv/12345
     *   /movie/67890
     *
     * lleguen correctamente a StreamDex.
     */

    const PLAY_STORE_URL =
      "https://play.google.com/store/apps/details?id=com.akissame.streamdex";

    /*
     * Sustituir XXXXXXXX por el ID real de StreamDex en App Store
     * cuando la aplicación iOS esté publicada.
     */
    const APP_STORE_URL =
      "https://apps.apple.com/app/streamdex/idXXXXXXXX";

    function detectPlatform() {
      const ua = navigator.userAgent || navigator.vendor || "";

      if (/android/i.test(ua)) {
        return "android";
      }

      /*
       * Incluye iPhone/iPad/iPod y también iPadOS que puede identificarse
       * como Macintosh cuando navigator.maxTouchPoints > 1.
       */
      if (
        /iPhone|iPad|iPod/i.test(ua) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        )
      ) {
        return "ios";
      }

      return "other";
    }

    function getOriginalPath() {
      /*
       * Conservamos pathname + query string.
       *
       * Ejemplo:
       * https://dominio.com/tv/123?season=2
       *
       * devuelve:
       * /tv/123?season=2
       */
      return window.location.pathname + window.location.search;
    }

    function getDeepLink() {
      return "streamdex:/" + getOriginalPath();
    }

    function showStatus(message) {
      const loader = document.getElementById("loader");
      const status = document.getElementById("status");
      const fallback = document.getElementById("fallback");

      if (loader) {
        loader.style.display = "none";
      }

      if (status) {
        status.textContent = message;
      }

      if (fallback) {
        fallback.style.display = "block";
      }
    }

    function redirectToStore(platform) {
      if (platform === "android") {
        window.location.replace(PLAY_STORE_URL);
        return;
      }

      if (platform === "ios") {
        /*
         * Mientras no exista el ID real de App Store, no enviamos
         * al usuario a una URL inválida.
         */
        if (!APP_STORE_URL.includes("idXXXXXXXX")) {
          window.location.replace(APP_STORE_URL);
          return;
        }

        showStatus(
          "StreamDex para iPhone aún no tiene una Store configurada."
        );
        return;
      }

      showStatus(
        "Abre este enlace desde tu celular para continuar en StreamDex."
      );
    }

    function openStreamDex() {
      const platform = detectPlatform();

      /*
       * En escritorio no intentamos ejecutar el esquema personalizado.
       * No tiene sentido mostrar una Store móvil automáticamente.
       */
      if (platform === "other") {
        window.location.replace("https://streamdex.akissame.com.co");
        return;
      }

      const deepLink = getDeepLink();

      let appOpened = false;

      /*
       * Si el navegador abandona esta página porque abrió la aplicación,
       * evitamos ejecutar el fallback hacia la Store.
       */
      const markAppOpened = function() {
        appOpened = true;
      };

      document.addEventListener(
        "visibilitychange",
        function() {
          if (document.hidden) {
            markAppOpened();
          }
        },
        { once: true }
      );

      window.addEventListener(
        "pagehide",
        markAppOpened,
        { once: true }
      );

      /*
       * Intentar abrir StreamDex conservando la ruta.
       */
      window.location.href = deepLink;

      /*
       * Si seguimos visibles después de este tiempo, asumimos que
       * la aplicación no está instalada.
       */
      setTimeout(function() {
        if (!appOpened && !document.hidden) {
          redirectToStore(platform);
        }
      }, 50);
    }

    window.addEventListener("load", openStreamDex);
  </script>
</head>

<body>
  <div class="card">
    <div class="logo">
      Stream<span>Dex</span>
    </div>

    <p class="subtitle">
      Tu índice personal del mundo del streaming
    </p>

    <div id="loader" class="loader"></div>

    <p id="status" class="status">
      Abriendo StreamDex…
    </p>

    <p id="fallback" class="fallback">
      Si no se abre automáticamente, comprueba que estás utilizando
      un dispositivo compatible.
    </p>
  </div>
</body>
</html>
