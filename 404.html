<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>StreamDex</title>
  <script>
    // FIX: en vez de sessionStorage (frágil: falla en modo incógnito,
    // con particionamiento de storage, o simplemente es difícil de
    // depurar sin DevTools), pasamos la ruta original como query param.
    // Esto es visible directamente en la URL y no depende de ninguna
    // API de almacenamiento del navegador.
    var path = encodeURIComponent(window.location.pathname);
    window.location.replace('/?sdx_redirect=' + path);
  </script>
</head>
<body></body>
</html>
