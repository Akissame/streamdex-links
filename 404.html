<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0A0A0F;
      color: #F0F0F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .logo span {
      color: #6C63FF;
    }
    .subtitle {
      color: #8E8EA0;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .loader {
      width: 22px;
      height: 22px;
      margin: 0 auto 18px;
      border: 2px solid #2A2A38;
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      color: #8E8EA0;
      font-size: 14px;
      line-height: 1.5;
    }
    .fallback {
      display: none;
      margin-top: 20px;
      color: #4A4A5E;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
  <script>
    /*
     * StreamDex - Smart Redirect (sin timeout en Android)
     *
     * Android  → Intent URL nativo de Chrome
     *            - App instalada  → abre StreamDex con la ruta
     *            - App no instalada → abre la app de Play Store
     *
     * iOS      → esquema personalizado + fallback a App Store
     * Desktop  → página principal
     */

    const PACKAGE_NAME = "com.akissame.streamdex";
    const APP_STORE_ID = "XXXXXXXX"; // ← sustituir cuando exista

    function detectPlatform() {
      const ua = navigator.userAgent || navigator.vendor || "";
      if (/android/i.test(ua)) return "android";
      if (
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      ) {
        return "ios";
      }
      return "other";
    }

    function getOriginalPath() {
      // Conservamos pathname + query (ej: /tv/123?season=2)
      return window.location.pathname + window.location.search;
    }

    function showStatus(message) {
      const loader = document.getElementById("loader");
      const status = document.getElementById("status");
      const fallback = document.getElementById("fallback");
      if (loader) loader.style.display = "none";
      if (status) status.textContent = message;
      if (fallback) fallback.style.display = "block";
    }

    function openStreamDex() {
      const platform = detectPlatform();
      const path = getOriginalPath(); // ej: /tv/12345

      // ——— Escritorio ———
      if (platform === "other") {
        window.location.replace("https://streamdex.akissame.com.co");
        return;
      }

      // ——— Android (solución principal) ———
      if (platform === "android") {
        /*
         * Intent URL oficial de Chrome:
         * - scheme = streamdex
         * - package = com.akissame.streamdex
         * - Si la app existe → la abre con la ruta
         * - Si no existe → usa el fallback
         *
         * Usamos market:// como fallback para forzar la app de Play Store
         * en lugar del navegador.
         */
        const fallback = encodeURIComponent(
          "market://details?id=" + PACKAGE_NAME
        );

        const intentUrl =
          "intent://" +
          path.replace(/^\//, "") +          // quitamos la / inicial
          "#Intent;" +
          "scheme=streamdex;" +
          "package=" + PACKAGE_NAME + ";" +
          "S.browser_fallback_url=" + fallback + ";" +
          "end";

        window.location.replace(intentUrl);
        return;
      }

      // ——— iOS ———
      if (platform === "ios") {
        const deepLink = "streamdex:/" + path;

        // Intentamos abrir la app
        window.location.href = deepLink;

        // Fallback corto solo para iOS (necesario porque no existe Intent nativo)
        setTimeout(function () {
          if (document.hidden || document.webkitHidden) return; // la app se abrió

          if (APP_STORE_ID === "XXXXXXXX") {
            showStatus("StreamDex para iPhone aún no tiene una Store configurada.");
            return;
          }
          // itms-apps:// abre la aplicación de App Store
          window.location.replace(
            "itms-apps://apps.apple.com/app/id" + APP_STORE_ID
          );
        }, 1500);
      }
    }

    // Ejecutar lo antes posible
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", openStreamDex);
    } else {
      openStreamDex();
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">
      Stream<span>Dex</span>
    </div>
    <p class="subtitle">
      Tu índice personal del mundo del streaming
    </p>
    <div id="loader" class="loader"></div>
    <p id="status" class="status">
      Abriendo StreamDex…
    </p>
    <p id="fallback" class="fallback">
      Si no se abre automáticamente, comprueba que estás utilizando
      un dispositivo compatible.
    </p>
  </div>
</body>
</html>
