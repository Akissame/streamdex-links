<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDex</title>

  <!-- Redirect lo más temprano posible -->
  <script>
    (function () {
      const PACKAGE_NAME = "com.akissame.streamdex";
      const APP_STORE_ID = "XXXXXXXX"; // ← cambiar cuando exista
      const MAIN_SITE = "https://streamdex.akissame.com.co";

      const ua = navigator.userAgent || navigator.vendor || "";
      const isAndroid = /android/i.test(ua);
      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      // Escritorio → sitio principal
      if (!isAndroid && !isIOS) {
        location.replace(MAIN_SITE);
        return;
      }

      const path = location.pathname + location.search;

      // ——— Android ———
      if (isAndroid) {
        // Intent URL → abre la app o la Play Store (app nativa)
        const fallback = encodeURIComponent("market://details?id=" + PACKAGE_NAME);
        const intentUrl =
          "intent://" +
          path.replace(/^\//, "") +
          "#Intent;" +
          "scheme=streamdex;" +
          "package=" + PACKAGE_NAME + ";" +
          "S.browser_fallback_url=" + fallback + ";" +
          "end";

        location.replace(intentUrl);
        return;
      }

      // ——— iOS ———
      if (isIOS) {
        location.href = "streamdex:/" + path;

        // Solo iOS necesita un pequeño fallback
        setTimeout(function () {
          if (document.hidden || document.webkitHidden) return;
          if (APP_STORE_ID === "XXXXXXXX") return;
          location.replace("itms-apps://apps.apple.com/app/id" + APP_STORE_ID);
        }, 1200);
      }
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0F;
      color: #F0F0F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }
    .logo { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .logo span { color: #6C63FF; }
    .subtitle { color: #8E8EA0; font-size: 15px; margin-bottom: 28px; }
    .loader {
      width: 22px; height: 22px; margin: 0 auto 18px;
      border: 2px solid #2A2A38;
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #8E8EA0; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Stream<span>Dex</span></div>
    <p class="subtitle">Tu índice personal del mundo del streaming</p>
    <div class="loader"></div>
    <p class="status">Abriendo StreamDex…</p>
  </div>
</body>
</html>
